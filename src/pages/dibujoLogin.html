<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- P5.js administrar componentes Web = canvas, cámara, sonido, etc. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>

    <!-- ML5.js - Machine Learning -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <style>
      body {
        background-color: bisque;
      }

      canvas {
        display: block;
        margin: 0 auto;
        border: 2px solid black;
      }

      #login-container {
        position: absolute;
        top: 10px;
        left: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
      }
    </style>

    <div id="login-container">
      <input type="text" id="username" placeholder="Usuario" />
      <input type="password" id="password" placeholder="Contraseña" />
      <button id="login-button">Ingresar</button>
    </div>

    <script>
      //Objeto de clasificación
      let classifier;

      //Botón para reiniciar el lienzo (canvas)
      let clearButton;

      //Referencia (capa mostrar resultado, lienzo)
      let resultsDiv;
      let canvas;

      // Usuarios falsos
      const users = [
        { username: "user1", password: "password1", drawing: "cat" },
        { username: "user2", password: "password2", drawing: "strawberry" },
        { username: "user3", password: "password3", drawing: "apple" },
        { username: "user4", password: "password4", drawing: "bicycle" },
      ];

      let currentLabel = "";
      let currentConfidence = 0;

      function preload() {
        classifier = ml5.imageClassifier("DoodleNet");
      }

      function setup() {
        canvas = createCanvas(480, 480);
        background(255);

        //Identificación en tiempo real
        classifier.classifyStart(canvas, gotResult);

        resultsDiv = createDiv("Calculando...");

        clearButton = createButton("Reiniciar");
        clearButton.mousePressed(clearCanvas);

        const loginButton = document.getElementById("login-button");
        loginButton.addEventListener("click", login);
      }

      function gotResult(results) {
        currentLabel = results[0].label;
        currentConfidence = results[0].confidence;
        resultsDiv.html(currentLabel + " - " + currentConfidence);
      }

      function clearCanvas() {
        background(255);
      }

      function draw() {
        strokeWeight(24); //Grosor lápiz
        stroke(0); //Color trazo

        if (mouseIsPressed) {
          //p = pressed
          line(pmouseX, pmouseY, mouseX, mouseY);
        }
      }

      function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const user = users.find(
          (u) => u.username === username && u.password === password
        );

        if (user) {
          if (currentLabel === user.drawing && currentConfidence >= 0.8) {
            alert("Bienvenido " + user.username);
          } else {
            alert(
              "Dibujo incorrecto o no se alcanza el 80% de confianza. Se requiere: " +
                user.drawing
            );
          }
        } else {
          alert("Usuario o contraseña incorrectos");
        }
      }
    </script>
  </body>
</html>
