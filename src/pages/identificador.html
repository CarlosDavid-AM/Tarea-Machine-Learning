<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML5 - Imágenes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <div class="container mt-3">
      <h3>Identificando objetos</h3>
      <div class="row">
        <div class="col-md-6 mx-auto" id="contenedor">
          <!-- Aquí debe renderizarse el canvas -->
        </div>
      </div>
      <div class="row mt-3">
        <!-- Subida de archivo -->
        <div class="col-md-6 mx-auto">
          <label for="file-uploader" class="form-label">Sube una imagen:</label>
          <input
            type="file"
            id="file-uploader"
            class="form-control"
            accept="image/*"
          />
        </div>
        <!--  -->
      </div>
      <div class="row">
        <div class="col-md-12">
          <div
            id="barra1"
            class="progress mb-1"
            role="progressbar"
            aria-label="Basic example"
            aria-valuenow="70"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar text-bg-success"></div>
          </div>

          <div
            id="barra2"
            class="progress mb-1"
            role="progressbar"
            aria-label="Basic example"
            aria-valuenow="20"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar text-bg-info"></div>
          </div>

          <div
            id="barra3"
            class="progress mb-1"
            role="progressbar"
            aria-label="Basic example"
            aria-valuenow="10"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div class="progress-bar text-bg-danger"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      //Objeto que permitirá el reconocimiento (clasificador)
      let classifier;

      //Objeto que contendrá referenciada la imagen a clasificar
      let img;

      //Lienzo donde se renderiza resultado
      let canvas;

      let label = "";
      let confidence = "";

      //1. preload (precarga) - función ml5
      function preload() {
        //MobileNet = modelo básico entrenado de reconocimiento
        classifier = ml5.imageClassifier("MobileNet");
      }

      //2. configuración - función ml5
      function setup() {
        //Canvas = lienzo (renderizar, pintar)
        canvas = createCanvas(400, 400);
        canvas.parent("contenedor");
        background(220); // Color de fondo inicial para el canvas

        const fileUploader = document.getElementById("file-uploader");
        fileUploader.addEventListener("change", handleImageUpload);
      }

      // Manejar la carga de la imagen
      function handleImageUpload(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            img = loadImage(event.target.result, imageLoaded);
          };
          reader.readAsDataURL(file);
        }
      }

      // Cuando la imagen se ha cargado
      function imageLoaded() {
        image(img, 0, 0, width, height);
        classifier.classify(img, gotResult);
      }

      //0.454987987874
      function getPorcentual(value) {
        let porcentual = nf(value, 0, 2) * 100; //45
        return porcentual + "%";
      }

      //Callback function
      //results es un arreglo de 3 elementos
      function gotResult(results) {
        //Mostrar resultado en consola
        console.log(results);

        for (let i = 0; i < 3; i++) {
          let num = i + 1;
          document.querySelector(`#barra${num} .progress-bar`).style.width =
            getPorcentual(results[i].confidence);
          document.querySelector(`#barra${num} .progress-bar`).innerHTML =
            results[i].label + ":" + getPorcentual(results[i].confidence);
        }

        /*
        document.querySelector("#barra1 .progress-bar").style.width = getPorcentual(results[0].confidence)
        document.querySelector("#barra1 .progress-bar").innerHTML = getPorcentual(results[0].confidence)

        document.querySelector("#barra2 .progress-bar").style.width = getPorcentual(results[1].confidence)
        document.querySelector("#barra2 .progress-bar").innerHTML = getPorcentual(results[1].confidence)

        document.querySelector("#barra3 .progress-bar").style.width = getPorcentual(results[2].confidence)
        document.querySelector("#barra3 .progress-bar").innerHTML = getPorcentual(results[2].confidence)
        */
      }
    </script>
  </body>
</html>
